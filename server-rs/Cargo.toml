[package]
name = "wuxian-horror-ch1"
version = "1.0.0"
edition = "2021"
autobins = false
build = "build.rs"
[lib]
name = "wuxian_horror_ch1"
path = "src/lib.rs"
[[bin]]
name = "wuxian_v1_authority"
path = "src/godot_main.rs"
[features]
default = []
deterministic-replay = []
legacy-test-rng = []
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rand = "=0.8.7"
sha2 = "=0.10.9"
[build-dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.9"