[package]
name = "wuxian-horror-ch1"
version = "1.0.0"
edition = "2021"
description = "无限轮回·第一章 生化蜂巢 —— Tauri 全栈（Rust 引擎 + WebView 前端）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 2
