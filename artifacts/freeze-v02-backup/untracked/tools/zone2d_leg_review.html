<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Zone2D 腿部验收</title>
<style>html,body{margin:0;padding:0;background:#070a0e;overflow:hidden}</style>
</head><body>
<div id="host"></div>
<script src="/js/world2d_art.js"></script>
<script>
// ?legacy=1 → 载入 tools/_zone2d_legacy.js（改动前的程序化梯形腿），用于 A/B 对照
document.write('<script src="' + (/legacy=1/.test(location.search) ? '/js/zone2d_legacy.js' : '/js/zone2d.js') + '"><\/script>');
</script>
<script>
(function () {
  // ' ' = 空气（暗底，不可站立）；'.' = 地面格（可站立、不阻挡水平移动 —— solidAt 只认 #/C）。
  // 房间取 12x6 格：zone2d 的 roomLocked 会判定为 LOCKED，镜头锁死在房间中心，
  // 角色屏幕位置完全确定，便于精确裁剪特写。
  var W = 60, H = 40, GROUND = 30;
  var tiles = [];
  for (var y = 0; y < H; y++) {
    tiles.push(y >= GROUND ? new Array(W + 1).join(".") : new Array(W + 1).join(" "));
  }
  var map = {
    w: W, h: H, tiles: tiles,
    background: "img_corridor.png",
    rooms: [{ x: 20, y: 25, w: 12, h: 6, type: "room" }],
    player_start: { x: 22, y: GROUND - 1 },
    enemy_spawns: []
  };
  window.__boot = function () {
    window.Zone2D.init(document.getElementById("host"), {});
    window.Zone2D.setData({ map: map, enemy: null });
    window.Zone2D.setResolution("1080");
    return true;
  };
  window.addEventListener("load", function () { window.__boot(); window.__ready = true; });
})();
</script>
</body></html>
