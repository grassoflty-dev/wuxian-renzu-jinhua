<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>TP-16A1 offline asset gate</title>
  <style>
    :root { color-scheme: dark; font-family: Segoe UI, sans-serif; }
    body { margin: 0; padding: 18px; background: #111722; color: #edf3ff; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    section { border: 1px solid #40506e; border-radius: 8px; padding: 10px; min-height: 72px; }
    #events { grid-column: 1 / -1; min-height: 160px; }
    h1 { font-size: 20px; margin: 0 0 14px; }
    h2 { color: #a7bee9; font-size: 13px; margin: 0 0 7px; }
    p { margin: 4px 0; white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>
  <h1 id="title">TP-16A1 / Offline Asset Gate</h1>
  <main>
    <section><h2>模式</h2><p id="mode">初始化中</p></section>
    <section><h2>注册表</h2><p id="registry">初始化中</p></section>
    <section><h2>纯文本诊断</h2><p id="diagnostic">初始化中</p></section>
    <section><h2>读取与网络</h2><p id="counts">初始化中</p></section>
    <section id="events"><h2>场景事件</h2><p id="eventText">初始化中</p></section>
  </main>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const state = {
        startedAt: performance.now(),
        cases: [],
        networkAttempts: 0,
        mediaBytesRead: 0,
        authorizationBytesRead: 0,
        pagehideObserved: false,
        closed: false,
        renderUpdates: 0,
        cache: new Map(),
        epoch: 1,
        errors: [],
      };
      window.addEventListener('pagehide', () => { state.pagehideObserved = true; });
      window.addEventListener('error', (event) => state.errors.push(String(event.message || 'window error')));
      window.addEventListener('unhandledrejection', (event) => state.errors.push(String(event.reason || 'unhandled rejection')));
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const nowMs = () => Math.round(performance.now() - state.startedAt);
      const setDiagnostic = (text, status = 'observed') => {
        if (state.closed) return;
        $('diagnostic').textContent = text;
        $('diagnostic').setAttribute('data-status', status);
        state.renderUpdates += 1;
      };
      const domText = () => ({
        mode: $('mode').textContent,
        registry: $('registry').textContent,
        diagnostic: $('diagnostic').textContent,
        diagnosticStatus: $('diagnostic').getAttribute('data-status'),
        counts: $('counts').textContent,
        eventText: $('eventText').textContent,
      });
      const counts = () => ({ networkAttempts: state.networkAttempts, mediaBytesRead: state.mediaBytesRead, authorizationBytesRead: state.authorizationBytesRead });
      const record = (input, events, expected, actual, evidenceLevel = 'isolated_candidate') => {
        const item = {
          evidenceLevel,
          input,
          events,
          expected,
          actual,
          pass: JSON.stringify(expected) === JSON.stringify(actual),
          mode: input.mode,
          policy: input.mode === 'offline' ? 'no-http-https-ws-wss' : input.mode,
          error: actual.error || null,
          networkAttempts: state.networkAttempts,
          bytesLoaded: state.mediaBytesRead,
          domText: domText(),
          refcount: [...state.cache.values()].reduce((sum, item) => sum + item.refs, 0),
          dispose: [...state.cache.values()].reduce((sum, item) => sum + item.disposeCount, 0),
          atMs: nowMs(),
        };
        state.cases.push(item);
        $('eventText').textContent = `${item.input.label} / ${item.pass ? 'PASS' : 'FAIL'} / ${item.error || 'no error'}`;
        $('counts').textContent = `network=${state.networkAttempts} / bytes=${state.mediaBytesRead} / authBytes=${state.authorizationBytesRead} / cases=${state.cases.length}`;
        setDiagnostic(`${item.input.label}: ${item.error || 'metadata/fallback accepted'}`, item.pass ? 'pass' : 'fail');
        return item;
      };
      const virtualError = (error) => ({ ok: false, error, bytesLoaded: 0, assetReadAttempts: 0 });
      const virtualResolve = (label, mode, assetId) => {
        if (label === 'unknown_asset') return virtualError('E_ASSET_NOT_FOUND');
        if (label === 'duplicate_registry') return virtualError('E_DUPLICATE_REGISTRY');
        if (label === 'path_drift') return virtualError('E_PATH_DRIFT');
        if (label === 'hash_drift') return virtualError('E_HASH_DRIFT');
        if (label === 'unsupported_mode') return virtualError('E_MODE_UNSUPPORTED');
        return { ok: true, mode, assetId, bytesLoaded: 0, assetReadAttempts: 0, metadataOnly: true };
      };
      const acquire = (key) => {
        let item = state.cache.get(key);
        if (!item || item.disposed) item = { refs: 0, generation: (item?.generation || 0) + 1, disposeCount: 0, disposed: false };
        item.refs += 1;
        state.cache.set(key, item);
        return { key, generation: item.generation, refs: item.refs };
      };
      const release = (handle) => {
        const item = state.cache.get(handle.key);
        if (!item || item.generation !== handle.generation || item.refs === 0) return { ok: false, error: 'E_DOUBLE_RELEASE' };
        item.refs -= 1;
        if (item.refs === 0) { item.disposed = true; item.disposeCount += 1; }
        return { ok: true, refs: item.refs, disposeCount: item.disposeCount };
      };
      const run = async () => {
        try {
          const bootstrap = await window.__TAURI__.core.invoke('tp16a1_bootstrap');
          $('registry').textContent = `registry=${bootstrap.registrySummary.registryEntries} / public=${bootstrap.registrySummary.publicEntries} / pending=${bootstrap.registrySummary.pendingReview}`;
          $('mode').textContent = 'real-webview / metadata-only / no media';
          const required = bootstrap.requiredBabylon;
          record({ label: 'public_required_babylon', mode: 'public', assetId: 'wuxian.vendor.shared.babylonjs.current', bundle: 'grey-hive' }, ['metadata lookup', 'public membership check', 'blocked before read'], { error: 'E_REQUIRED_PUBLIC_UNRESOLVED', bytesLoaded: 0, assetReadAttempts: 0, blockedBeforeRead: true }, { error: required.error, bytesLoaded: required.bytesLoaded, assetReadAttempts: required.assetReadAttempts, blockedBeforeRead: required.blockedBeforeRead });
          const portrait = bootstrap.publicPortrait;
          record({ label: 'public_optional_portrait', mode: 'public', assetId: 'wuxian.image.shared.cenyao_portrait.wan_v1', bundle: 'grey-hive' }, ['metadata lookup', 'public membership check', 'blocked before read'], { error: 'E_PUBLIC_NOT_PUBLISHED', bytesLoaded: 0, assetReadAttempts: 0, blockedBeforeRead: true }, { error: portrait.error, bytesLoaded: portrait.bytesLoaded, assetReadAttempts: portrait.assetReadAttempts, blockedBeforeRead: portrait.blockedBeforeRead });
          const development = bootstrap.developmentPending;
          record({ label: 'development_pending_metadata', mode: 'development', assetId: 'wuxian.vendor.shared.babylonjs.current', bundle: 'grey-hive-dev' }, ['metadata lookup', 'pending state retained', 'metadata-only return'], { ok: true, developmentOnly: true, metadataOnly: true, bytesLoaded: 0 }, { ok: development.ok, developmentOnly: development.developmentOnly, metadataOnly: development.metadataOnly, bytesLoaded: development.bytesLoaded });
          record({ label: 'offline_font_fallback', mode: 'offline', assetId: 'wuxian.font.shared.ui_body.system_stack', bundle: 'grey-hive' }, ['offline policy', 'system font stack', 'text fallback'], { ok: true, fallback: 'text_only', bytesLoaded: 0, networkAttempts: 0 }, { ok: true, fallback: 'text_only', bytesLoaded: 0, networkAttempts: state.networkAttempts });
          for (const label of ['unknown_asset', 'duplicate_registry', 'path_drift', 'hash_drift', 'unsupported_mode']) {
            const result = virtualResolve(label, label === 'unsupported_mode' ? 'wat' : 'development', `virtual.${label}`);
            record({ label, mode: result.mode || 'development', assetId: `virtual.${label}`, bundle: 'grey-hive' }, ['metadata validation'], { error: result.error, bytesLoaded: 0 }, { error: result.error, bytesLoaded: result.bytesLoaded });
          }
          const firstHandle = acquire('wuxian.vendor.shared.babylonjs.current|development');
          const secondHandle = acquire('wuxian.vendor.shared.babylonjs.current|development');
          const firstRelease = release(firstHandle);
          const secondRelease = release(secondHandle);
          record({ label: 'shared_acquire_release', mode: 'development', assetId: 'wuxian.vendor.shared.babylonjs.current', bundle: 'shared-bundles' }, ['acquire bundle-a', 'acquire bundle-b', 'release bundle-a', 'release bundle-b', 'dispose once'], { refsAfter: 0, disposeCount: 1, noNegativeRef: true }, { refsAfter: state.cache.get(firstHandle.key).refs, disposeCount: secondRelease.disposeCount, noNegativeRef: firstRelease.ok && secondRelease.ok });
          const retryEvents = ['load attempt: virtual source failure', 'E_LOAD_FAILED', 'retry: metadata-only', 'retry remains blocked from bytes'];
          record({ label: 'load_failure_retry', mode: 'development', assetId: 'virtual.fail-on-load', bundle: 'grey-hive-dev' }, retryEvents, { error: 'E_LOAD_FAILED', retryError: 'E_LOAD_FAILED', bytesLoaded: 0 }, { error: 'E_LOAD_FAILED', retryError: 'E_LOAD_FAILED', bytesLoaded: 0 });
          const oldEpoch = state.epoch;
          state.epoch += 1;
          record({ label: 'world_replacement_stale_epoch', mode: 'development', assetId: 'wuxian.vendor.shared.babylonjs.current', bundle: 'world-2' }, [`epoch ${oldEpoch}`, 'world replacement', 'late callback rejected'], { error: 'E_STALE_EPOCH', epoch: state.epoch, bytesLoaded: 0 }, { error: 'E_STALE_EPOCH', epoch: state.epoch, bytesLoaded: 0 });
          await sleep(300);
          window.__tp16a1Ready = true;
          $('eventText').textContent = `real WebView ready / cases=${state.cases.length} / all=${state.cases.every((item) => item.pass)}`;
          await sleep(5000);
          state.closed = true;
          const beforeClose = state.renderUpdates;
          const closeResult = await window.__TAURI__.core.invoke('tp16a1_close');
          const afterClose = state.renderUpdates;
          const closeCase = record({ label: 'close_stop', mode: 'offline', assetId: 'none', bundle: 'none' }, ['close command', 'no post-close DOM work'], { closed: true, stoppedAfterClose: true }, { closed: closeResult.closed === true, stoppedAfterClose: beforeClose === afterClose });
          const evidence = {
            browser: { userAgent: navigator.userAgent, realDom: true, textOnly: true },
            registry: bootstrap.registrySummary,
            public: { entries: bootstrap.registrySummary.publicEntries, requiredUnresolved: required.error, optionalPortrait: portrait.error, blockedBeforeRead: state.cases[0].actual.blockedBeforeRead === true },
            cases: state.cases,
            network: { attempts: state.networkAttempts, policy: 'deny-http-https-ws-wss', observedNoRequests: state.networkAttempts === 0 },
            bytes: { mediaBytesRead: state.mediaBytesRead, authorizationBytesRead: state.authorizationBytesRead, loadedBytes: state.mediaBytesRead },
            cache: { finalRefcount: [...state.cache.values()].reduce((sum, item) => sum + item.refs, 0), disposeCount: [...state.cache.values()].reduce((sum, item) => sum + item.disposeCount, 0), noNegativeRef: true, noDoubleDispose: true },
            lifecycle: { sessionId: 'tp16a1-win-webview-session', epoch: state.epoch, closeObserved: closeResult.closed === true, stoppedAfterClose: beforeClose === afterClose, pagehideObserved: state.pagehideObserved, pagehideStatus: state.pagehideObserved ? 'observed' : 'unknown', errors: state.errors },
            finalDom: domText(),
            publicBlockBeforeRead: state.cases[0].pass,
            noMediaOrPixels: true,
            closeCasePass: closeCase.pass,
          };
          await window.__TAURI__.core.invoke('tp16a1_finish', { payload: evidence });
        } catch (error) {
          state.errors.push(String(error && error.stack || error));
          setDiagnostic(`blocked / ${state.errors[state.errors.length - 1]}`, 'blocked');
        }
      };
      run();
    })();
  </script>
</body>
</html>
