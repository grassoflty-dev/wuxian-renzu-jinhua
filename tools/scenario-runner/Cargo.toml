[package]
name = "scenario-runner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wuxian-horror-ch1 = { path = "../../server-rs", features = ["deterministic-replay"] }

[[bin]]
name = "scenario-runner"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
