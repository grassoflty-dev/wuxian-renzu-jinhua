<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TP-14C1 World Routing</title>
  <style>
    body { background:#10151c; color:#e7edf5; font:14px/1.45 system-ui,sans-serif; margin:0; padding:24px; }
    #status { white-space:pre-wrap; background:#192331; border:1px solid #34465e; border-radius:8px; padding:16px; min-height:130px; }
    .ok { color:#7ee787; } .error { color:#ff7b72; }
  </style>
</head>
<body>
  <h1>TP-14C1 World Runtime Routing</h1>
  <div id="status">Starting real Windows WebView2 → Rust owner → typed Channel routing probe…</div>
<script>
(() => {
  const core = window.__TAURI__?.core;
  const statusNode = document.getElementById("status");
  const commands = [];
  const callbackRecords = [];
  const pendingCallbacks = new Map();
  const ackRecords = [];
  const ackErrors = [];
  const scenarios = [];
  const errors = [];
  let environment = null;
  let controllerSession = null;
  let currentEpoch = 0;
  let currentSession = null;
  let channel = null;
  let closeSummary = null;

  function show(text, kind = "") { statusNode.className = kind; statusNode.textContent = text; }
  function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
  function showError(error) { return String(error && error.stack ? error.stack : error); }
  function unique(values) { return [...new Set(values)]; }
  function invoke(name, args = {}) {
    if (!core?.invoke) return Promise.reject(new Error("tauri_core_invoke_unavailable"));
    const item = { name, argKeys: Object.keys(args), startedAt: new Date().toISOString() };
    const started = performance.now();
    return core.invoke(name, args).then(value => {
      item.ok = true; item.durationMs = performance.now() - started;
      commands.push(item); return value;
    }).catch(error => {
      item.ok = false; item.durationMs = performance.now() - started; item.error = showError(error);
      commands.push(item); throw error;
    });
  }
  function waitForCallback(requestId) {
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => { pendingCallbacks.delete(requestId); reject(new Error(`callback_timeout:${requestId}`)); }, 5000);
      pendingCallbacks.set(requestId, value => { clearTimeout(timeout); resolve(value); });
    });
  }
  function makeChannel() {
    const value = new core.Channel();
    value.onmessage = message => {
      const record = { receivedAt: new Date().toISOString(), seq: message.seq, requestId: message.requestId,
        accepted: message.accepted, activeOwnerCount: message.activeOwnerCount, ackRequired: message.ackRequired,
        route: message.route || null, error: message.error || null, protocol: message.protocol,
        version: message.version, callbackKind: message.callbackKind, evidenceLevel: message.evidenceLevel };
      callbackRecords.push(record);
      const route = message.route || null;
      const ackSession = route?.newSession || currentSession;
      const ackEpoch = route?.newEpoch ?? currentEpoch;
      if (ackSession) {
        invoke("tp14c1_ack", { controllerSession, routeSession: ackSession, epoch: ackEpoch, seq: message.seq })
          .then(ack => ackRecords.push({ requestId: message.requestId, seq: message.seq, ack }))
          .catch(error => ackErrors.push({ requestId: message.requestId, seq: message.seq, error: showError(error) }));
      }
      if (route && message.accepted) { currentSession = route.newSession; currentEpoch = route.newEpoch; }
      const resolver = pendingCallbacks.get(message.requestId);
      if (resolver) { pendingCallbacks.delete(message.requestId); resolver(record); }
    };
    return value;
  }
  function request(requestId, worldId, action, options = {}) {
    return { requestId, worldId, campaignVersion: 2, saveVersion: options.saveVersion ?? null,
      resumeCheckpoint: options.resumeCheckpoint ?? null, resultMap: Object.prototype.hasOwnProperty.call(options, "resultMap") ? options.resultMap : undefined,
      currentEpoch: options.currentEpoch ?? currentEpoch, currentSession: options.currentSession ?? currentSession,
      action, failureInjection: options.failureInjection ?? false, cadenceHz: options.cadenceHz ?? 30,
      eventTick: options.eventTick ?? 0 };
  }
  async function route(requestValue) {
    const callback = waitForCallback(requestValue.requestId);
    const reply = await invoke("tp14c1_route", { controllerSession, request: requestValue });
    return { reply, callback: await callback };
  }
  function expectedScenario(id, input, expected, actual, pass, error = null, extra = {}) {
    scenarios.push({ id, input, events: extra.events || ["WebView request", "Rust validation", "typed Channel callback", "JS ack"], expected,
      actual, pass: Boolean(pass), route: extra.route || null, mode: extra.mode || null, epoch: extra.epoch ?? currentEpoch,
      session: extra.session || currentSession, handoff: extra.handoff || null, oldOwnerLifecycle: extra.oldOwnerLifecycle || null,
      ack: extra.ack || null, error, evidenceLevel: extra.evidenceLevel || "real_webview_rust_owner_channel" });
  }
  function code(result) { return result?.reply?.error?.code || result?.callback?.error?.code || null; }
  function routeOf(result) { return result?.reply?.route || result?.callback?.route || null; }
  async function main() {
    environment = await invoke("tp14c1_environment", { userAgent: navigator.userAgent });
    channel = makeChannel();
    const boot = await invoke("tp14c1_boot", { channel });
    controllerSession = boot.controllerSession;

    let result = await route(request("c1-grey-new", "grey_hive", "start"));
    let r = routeOf(result);
    expectedScenario("grey_hive_new_start", { worldId:"grey_hive", action:"start", currentEpoch:0, currentSession:null },
      { route:"grey_hive", mode:"continuous_v3", activeOwnerCount:1 }, result.reply,
      result.reply.accepted && r.route === "grey_hive" && r.mode === "continuous_v3" && r.oldOwnerLifecycle.activeOwnerCountAfter === 1,
      null, { route:r, mode:r?.mode, epoch:r?.newEpoch, session:r?.newSession, handoff:r?.handoff, oldOwnerLifecycle:r?.oldOwnerLifecycle });

    result = await route(request("c2-grey-save-v3", "grey_hive", "resume", { saveVersion:3, resumeCheckpoint:"gh_cp_post_bio" }));
    r = routeOf(result);
    expectedScenario("grey_hive_save_v3_resume", { saveVersion:3, checkpoint:"gh_cp_post_bio" }, { mode:"continuous_v3", route:"grey_hive" }, result.reply,
      result.reply.accepted && r.handoff.kind === "resume_v3" && r.handoff.checkpoint === "gh_cp_post_bio", null,
      { route:r, mode:r?.mode, epoch:r?.newEpoch, session:r?.newSession, handoff:r?.handoff, oldOwnerLifecycle:r?.oldOwnerLifecycle });

    result = await route(request("c3-grey-complete-null", "grey_hive", "complete", { saveVersion:3, resultMap:null }));
    r = routeOf(result);
    expectedScenario("grey_hive_complete_map_null", { action:"complete", resultMap:null }, { route:"hub", mode:"legacy_v2", resultMap:null }, result.reply,
      result.reply.accepted && r.route === "hub" && r.resultMap === null && r.handoff.resultMap === null, null,
      { route:r, mode:r?.mode, epoch:r?.newEpoch, session:r?.newSession, handoff:r?.handoff, oldOwnerLifecycle:r?.oldOwnerLifecycle });

    result = await route(request("c4-mist-new", "mist_harbor", "switch")); r = routeOf(result);
    expectedScenario("mist_harbor_new_legacy", { worldId:"mist_harbor", action:"switch" }, { mode:"legacy_v2", route:"mist_harbor" }, result.reply,
      result.reply.accepted && r.route === "mist_harbor" && r.mode === "legacy_v2", null,
      { route:r, mode:r?.mode, epoch:r?.newEpoch, session:r?.newSession, handoff:r?.handoff, oldOwnerLifecycle:r?.oldOwnerLifecycle });

    result = await route(request("c5-mist-restore-v2", "mist_harbor", "resume", { saveVersion:2 })); r = routeOf(result);
    expectedScenario("mist_harbor_restore_v2", { saveVersion:2 }, { mode:"legacy_v2", handoff:"resume_legacy_v2" }, result.reply,
      result.reply.accepted && r.handoff.kind === "resume_legacy_v2", null,
      { route:r, mode:r?.mode, epoch:r?.newEpoch, session:r?.newSession, handoff:r?.handoff, oldOwnerLifecycle:r?.oldOwnerLifecycle });

    result = await route(request("c6-clockworks-new", "clockworks", "switch")); r = routeOf(result);
    expectedScenario("clockworks_new_legacy", { worldId:"clockworks", action:"switch" }, { mode:"legacy_v2", route:"clockworks" }, result.reply,
      result.reply.accepted && r.route === "clockworks" && r.mode === "legacy_v2", null,
      { route:r, mode:r?.mode, epoch:r?.newEpoch, session:r?.newSession, handoff:r?.handoff, oldOwnerLifecycle:r?.oldOwnerLifecycle });

    result = await route(request("c7-clockworks-restore-v2", "clockworks", "resume", { saveVersion:2 })); r = routeOf(result);
    expectedScenario("clockworks_restore_v2", { saveVersion:2 }, { mode:"legacy_v2", handoff:"resume_legacy_v2" }, result.reply,
      result.reply.accepted && r.handoff.kind === "resume_legacy_v2", null,
      { route:r, mode:r?.mode, epoch:r?.newEpoch, session:r?.newSession, handoff:r?.handoff, oldOwnerLifecycle:r?.oldOwnerLifecycle });

    result = await route(request("c8-grey-migrate-v2-v3", "grey_hive", "switch", { saveVersion:2, resumeCheckpoint:"gh_cp_power" })); r = routeOf(result);
    expectedScenario("grey_hive_v2_to_v3_migration", { saveVersion:2, checkpoint:"gh_cp_power" }, { mode:"continuous_v3", handoff:"migrate_v2_to_v3" }, result.reply,
      result.reply.accepted && r.handoff.kind === "migrate_v2_to_v3" && r.mode === "continuous_v3", null,
      { route:r, mode:r?.mode, epoch:r?.newEpoch, session:r?.newSession, handoff:r?.handoff, oldOwnerLifecycle:r?.oldOwnerLifecycle });

    result = await route(request("c9-legacy-save-v3-reject", "mist_harbor", "switch", { saveVersion:3 }));
    expectedScenario("legacy_save_v3_reject", { worldId:"mist_harbor", saveVersion:3 }, { errorCode:"E_LEGACY_SAVE_MUST_REMAIN_V2", activeOwnerUnchanged:true }, result.reply,
      !result.reply.accepted && code(result) === "E_LEGACY_SAVE_MUST_REMAIN_V2" && currentSession === r.newSession, code(result), { route:routeOf(result), error:result.reply.error });

    result = await route(request("c10-unknown-world", "not_a_world", "switch"));
    expectedScenario("unknown_world_reject", { worldId:"not_a_world" }, { errorCode:"E_UNKNOWN_WORLD" }, result.reply,
      !result.reply.accepted && code(result) === "E_UNKNOWN_WORLD", code(result), { error:result.reply.error });

    result = await route(request("c11-empty-world", "", "switch"));
    expectedScenario("empty_world_id_reject", { worldId:"" }, { errorCode:"E_WORLD_ID_EMPTY" }, result.reply,
      !result.reply.accepted && code(result) === "E_WORLD_ID_EMPTY", code(result), { error:result.reply.error });

    const duplicateRequest = request("c12-duplicate", "mist_harbor", "switch");
    const firstDuplicate = await route(duplicateRequest);
    const replayDuplicate = await route(duplicateRequest);
    const conflict = await route({ ...duplicateRequest, worldId:"grey_hive", currentEpoch:currentEpoch, currentSession:currentSession });
    expectedScenario("duplicate_request_idempotency_and_conflict", { requestId:duplicateRequest.requestId }, { replay:true, conflictError:"E_DUPLICATE_REQUEST_CONFLICT" },
      { first:firstDuplicate.reply, replay:replayDuplicate.reply, conflict:conflict.reply },
      firstDuplicate.reply.accepted && replayDuplicate.reply.route?.idempotentReplay === true && code(conflict) === "E_DUPLICATE_REQUEST_CONFLICT", code(conflict),
      { route:routeOf(replayDuplicate), handoff:routeOf(replayDuplicate)?.handoff, oldOwnerLifecycle:routeOf(replayDuplicate)?.oldOwnerLifecycle });

    const staleEpoch = currentEpoch - 1;
    result = await route(request("c13-stale-epoch", "clockworks", "switch", { currentEpoch:staleEpoch, currentSession }));
    expectedScenario("stale_epoch_or_session_reject", { currentEpoch:staleEpoch, activeEpoch:currentEpoch }, { errorCode:"E_STALE_EPOCH" }, result.reply,
      !result.reply.accepted && code(result) === "E_STALE_EPOCH", code(result), { error:result.reply.error });

    const oldSession = currentSession; const oldEpoch = currentEpoch;
    result = await route(request("c14-switch-before-late-callback", "clockworks", "switch"));
    const late = await invoke("tp14c1_callback_probe", { controllerSession, routeSession:oldSession, epoch:oldEpoch, callbackId:"late-old-owner" });
    expectedScenario("late_callback_after_owner_replacement", { oldSession, oldEpoch }, { errorCode:"E_LATE_CALLBACK" }, late,
      late.accepted === false && late.error?.code === "E_LATE_CALLBACK", late.error?.code, { route:routeOf(result), oldOwnerLifecycle:routeOf(result)?.oldOwnerLifecycle });

    const rollbackBefore = { epoch:currentEpoch, session:currentSession };
    result = await route(request("c15-failure-rollback", "grey_hive", "switch", { failureInjection:true }));
    expectedScenario("failure_rollback_before_publish", { failureInjection:true, target:"grey_hive" }, { errorCode:"E_HANDOFF_FAILED_ROLLBACK", activeOwnerUnchanged:true }, result.reply,
      !result.reply.accepted && code(result) === "E_HANDOFF_FAILED_ROLLBACK" && currentEpoch === rollbackBefore.epoch && currentSession === rollbackBefore.session, code(result), { error:result.reply.error });

    const roundtripEvents = []; let roundtripPass = true;
    for (let index = 0; index < 30; index += 1) {
      const target = index % 2 === 0 ? "grey_hive" : "mist_harbor";
      const item = await route(request(`c16-roundtrip-${index}`, target, "switch", { eventTick:index * 30 }));
      const routeResult = routeOf(item); roundtripEvents.push({ index, target, accepted:item.reply.accepted, route:routeResult?.route, mode:routeResult?.mode, epoch:routeResult?.newEpoch, session:routeResult?.newSession });
      roundtripPass = roundtripPass && item.reply.accepted && routeResult?.oldOwnerLifecycle?.activeOwnerCountAfter === 1;
    }
    const diagnostics = await invoke("tp14c1_diagnostics", { controllerSession });
    expectedScenario("thirty_cross_world_roundtrips_single_owner", { count:30, targets:["grey_hive","mist_harbor"] }, { activeOwnerCount:1, callbackAcked:true },
      { roundtripEvents, diagnostics }, roundtripPass && diagnostics.activeOwnerCount === 1 && diagnostics.rustCallbackCount === diagnostics.jsAckCount,
      null, { route:diagnostics.active, epoch:diagnostics.active?.epoch, session:diagnostics.active?.session, ack:{rust:diagnostics.rustCallbackCount, js:diagnostics.jsAckCount} });

    const callbacksBeforeClose = callbackRecords.length;
    closeSummary = await invoke("tp14c1_close", { controllerSession });
    await sleep(250);
    const callbacksAfterClose = callbackRecords.length;
    expectedScenario("webview_close_no_post_close_callback", { controllerSession }, { activeOwnerCountAfter:0, callbackDeltaAfterClose:0, stoppedCleanly:true },
      { closeSummary, callbacksBeforeClose, callbacksAfterClose, callbackDeltaAfterClose:callbacksAfterClose - callbacksBeforeClose },
      closeSummary.activeOwnerCountAfter === 0 && closeSummary.stoppedCleanly === true && callbacksAfterClose === callbacksBeforeClose,
      null, { ack:{rust:closeSummary.rustCallbackCount, js:closeSummary.jsAckCount}, evidenceLevel:"real_webview_close_join_and_channel_drop" });

    scenarios.push({ id:"process_normal_exit", input:{ expectedExitCode:0 }, events:["record result", "app.exit(0)"], expected:{ exitCode:0 },
      actual:{ exitCode:null, observation:"pending cargo run exit-code finalization" }, pass:false, error:"E_PROCESS_EXIT_CODE_PENDING_FINALIZER",
      evidenceLevel:"external_command_exit_code" });
    const report = { schema:"tauri_world_routing_tp14c1_v1", status:"pending_external_process_exit", machinePass:false,
      candidateOnly:true, localDevelopmentOnly:true, formalSceneReady:false, generatedAtUtc:new Date().toISOString(), environment,
      owner:{ authority:"Rust OwnerLoop only", jsRole:"route/open/resume/replace/close requests and display text; no authority",
        channel:"tauri::ipc::Channel<RouteEnvelope>", lifecycle:["stop_old_owner","drop_old_channel","join_old_thread","publish_new_session"], activeOwnerInvariant:"exactly one after successful route" },
      routerApi:{ input:["requestId","worldId","campaignVersion","saveVersion","resumeCheckpoint","resultMap","currentEpoch","currentSession","action"],
        output:["route","mode","newEpoch","newSession","handoff","oldOwnerLifecycle","stableError"], evidenceLevel:"isolated_candidate_tp14b1" },
      scenarios, callbacks:{ total:callbackRecords.length, records:callbackRecords, ackRecords, ackErrors }, commands,
      fixtureHashes:environment.fixtureHashes, lifecycle:{ controllerSession, currentEpoch, currentSession, closeSummary },
      roundtrip:{ count:30, activeOwnerCountAfter:1, diagnostics }, formalGaps:["formal CampaignStore and production owner handoff are not wired", "no gameplay or real save writes", "legacy regression remains a separate formal gate"],
      blockedInterfaces:["E_FORMAL_ROUTER_NOT_WIRED","E_REAL_OWNER_HANDOFF_UNAVAILABLE","E_LEGACY_REGRESSION_GATE_PENDING"],
      stop:{ ownerStopped:true, channelDropped:true, processExitObservedByHarness:false, processExitObservation:"pending cargo run exit-code finalization" },
      commandExitCodes:{ cargoFmt:null, cargoTest:null, cargoRun:null }, formalGate:{ tp14:"blocked/no_go", gateJ:"blocked/no_go", architecture:"blocked/no_go" }, evidenceLevel:"real_windows_webview_candidate" };
    await invoke("tp14c1_record_result", { report });
    show(`PASS candidate: real Windows WebView2 → Rust owner → typed Channel\nscenarios=${scenarios.length}, callbacks=${callbackRecords.length}, pending external exit-code finalization\nStopping…`, "ok");
    await sleep(100);
    await invoke("tp14c1_finish");
  }
  main().catch(async error => {
    const diagnostic = showError(error); errors.push(diagnostic); show(`FAIL: ${diagnostic}`, "error");
    try { await invoke("tp14c1_record_result", { report:{ schema:"tauri_world_routing_tp14c1_v1", status:"blocked_probe_failure", machinePass:false,
      candidateOnly:true, localDevelopmentOnly:true, formalSceneReady:false, diagnostic, scenarios, errors, commands,
      stop:{ processExitObservedByHarness:false, processExitObservation:"pending cargo run exit-code" }, formalGate:{ tp14:"blocked", gateJ:"blocked/no_go", architecture:"blocked/no_go" } } }); await sleep(50); await invoke("tp14c1_finish"); } catch (_) {}
  });
})();
</script>
</body>
</html>
