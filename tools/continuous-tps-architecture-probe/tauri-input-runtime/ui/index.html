<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TP-06B1 WebView Input Runtime</title>
  <style>
    body { background:#12161d; color:#e9eef7; font:14px/1.45 system-ui,sans-serif; margin:0; padding:24px; }
    #status { white-space:pre-wrap; background:#1b2330; border:1px solid #34445d; border-radius:8px; padding:16px; min-height:120px; }
    .ok { color:#7ee787; } .error { color:#ff7b72; }
  </style>
</head>
<body>
  <h1>TP-06B1 WebView Input Runtime</h1>
  <div id="status">Starting real WebView → Tauri command → Rust owner probe…</div>
<script>
(() => {
  const statusNode = document.getElementById("status");
  const core = window.__TAURI__?.core;
  const startedPerfMs = performance.now();
  const commands = [];
  const callbackRecords = [];
  const channelRecords = new Map();
  const errors = [];
  const nativeEvents = [];
  let session = null;
  let activeChannelName = null;
  let oldSessionId = null;
  let oldChannelName = null;
  let newChannelName = null;

  function show(text, kind = "") {
    statusNode.className = kind;
    statusNode.textContent = text;
  }
  function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
  function nowMs() { return performance.now(); }
  function payloadBytes(value) { return new TextEncoder().encode(value).length; }
  function recordNative(type, detail) {
    nativeEvents.push({ type, detail, perfMs: nowMs(), visibilityState: document.visibilityState, hasFocus: document.hasFocus() });
  }
  window.addEventListener("blur", () => recordNative("blur", "native_window_event"));
  window.addEventListener("focus", () => recordNative("focus", "native_window_event"));
  document.addEventListener("visibilitychange", () => recordNative("visibilitychange", "native_document_event"));

  async function invoke(name, args = {}) {
    if (!core?.invoke) throw new Error("tauri_core_invoke_unavailable");
    const start = nowMs();
    const item = { name, startPerfMs: start, argsSummary: Object.keys(args) };
    try {
      const value = await core.invoke(name, args);
      item.endPerfMs = nowMs();
      item.durationMs = item.endPerfMs - start;
      item.ok = true;
      item.result = value;
      commands.push(item);
      return value;
    } catch (error) {
      item.endPerfMs = nowMs();
      item.durationMs = item.endPerfMs - start;
      item.ok = false;
      item.errorCode = String(error);
      commands.push(item);
      return Promise.reject(error);
    }
  }

  function makeChannel(name) {
    const channel = new core.Channel();
    const records = [];
    channelRecords.set(name, records);
    channel.onmessage = (snapshot) => {
      const callbackStart = nowMs();
      const jsonText = JSON.stringify(snapshot);
      const record = {
        channel: name,
        callbackPerfMs: callbackStart,
        callbackWallMs: Date.now(),
        payloadBytes: payloadBytes(jsonText),
        epoch: snapshot.worldEpoch,
        tick: snapshot.serverTick,
        ackSeq: snapshot.ackSeq,
        edgeIds: (snapshot.edgeEvents || []).map(event => event.id),
        protocol: snapshot.protocol,
        version: snapshot.version,
        worldId: snapshot.worldId
      };
      records.push(record);
      callbackRecords.push(record);
    };
    return channel;
  }

  function frame(epoch, seq, heldX = 0, heldZ = 0, edges = []) {
    return {
      protocol: "continuous-ipc",
      version: 1,
      worldEpoch: epoch,
      seq,
      clientTimeMs: Math.floor(performance.timeOrigin + performance.now()),
      heldAxes: { x: heldX, z: heldZ },
      buttons: { jump: false, dash: false, interact: false },
      edgeEvents: edges.map(([id, kind]) => ({ id, kind }))
    };
  }

  async function sendFrame(epoch, seq, heldX = 0, heldZ = 0, edges = []) {
    const jsonText = JSON.stringify(frame(epoch, seq, heldX, heldZ, edges));
    const result = await invoke("tp06b_input", { sessionId: session.sessionId, payload: jsonText });
    return { result, payloadBytes: payloadBytes(jsonText), seq, epoch, edgeIds: edges.map(edge => edge[0]) };
  }

  async function waitFor(predicate, timeoutMs, label) {
    const deadline = nowMs() + timeoutMs;
    while (nowMs() < deadline) {
      if (predicate()) return;
      await sleep(5);
    }
    throw new Error(`timeout:${label}`);
  }

  function recordsFor(name) { return channelRecords.get(name) || []; }
  async function waitForAck(name, epoch, ack, label) {
    await waitFor(() => recordsFor(name).some(record => record.epoch === epoch && record.ackSeq >= ack), 4000, label);
  }

  function scenario(name, details, pass) {
    const result = { name, pass: Boolean(pass), ...details };
    if (!result.pass) errors.push(`scenario_failed:${name}`);
    return result;
  }

  async function main() {
    if (!core?.invoke || !core?.Channel) throw new Error("withGlobalTauri_core_invoke_or_channel_unavailable");
    const environment = await invoke("tp06b_environment", { userAgent: navigator.userAgent });
    const channelA = makeChannel("channel-a-epoch-1");
    activeChannelName = "channel-a-epoch-1";
    session = await invoke("tp06b_start", { channel: channelA, worldEpoch: 1 });
    const initialSession = session;
    const scenarios = [];

    const normalInputs = [];
    for (let seq = 1; seq <= 6; seq += 1) {
      normalInputs.push(await sendFrame(1, seq, seq === 6 ? 0.25 : 0.1, 0.0, seq === 3 ? [[1001, "interact"]] : []));
      await sleep(8);
    }
    await waitForAck(activeChannelName, 1, 6, "normal_ack_6");
    const normalDiagnostics = await invoke("tp06b_diagnostics", { sessionId: session.sessionId });
    const normalEdges = (normalDiagnostics.consumedEdgeIds || []).filter(id => id === 1001);
    scenarios.push(scenario("normal_held_edge_short_flow", {
      inputCount: normalInputs.length,
      inputPayloadBytes: normalInputs.map(item => item.payloadBytes),
      callbackCount: recordsFor(activeChannelName).length,
      edgeCallbackCount: 0,
      edgeConsumedCountFromFormalReceiver: normalEdges.length,
      edgeEvidence: "formal InputReceiver diagnostics; WorldView DTO has no edgeEvents field",
      edgeExactlyOnce: normalEdges.length === 1,
      ackMonotonic: recordsFor(activeChannelName).every((item, index, all) => index === 0 || item.ackSeq >= all[index - 1].ackSeq),
      tickMonotonic: recordsFor(activeChannelName).every((item, index, all) => index === 0 || item.tick > all[index - 1].tick)
    }, normalEdges.length === 1));

    const duplicate = await sendFrame(1, 6, 0, 0);
    const gap9 = await sendFrame(1, 9, 0, 0);
    const gap8 = await sendFrame(1, 8, 0, 0);
    const gap7 = await sendFrame(1, 7, 0, 0);
    await waitForAck(activeChannelName, 1, 9, "gap_recovery_ack_9");
    scenarios.push(scenario("duplicate_out_of_order_gap", {
      duplicateOutcome: duplicate.result.outcome,
      gap9Outcome: gap9.result.outcome,
      gap8Outcome: gap8.result.outcome,
      gap7Outcome: gap7.result.outcome,
      contiguousRecoveryAck: gap7.result.ackSeq === 9,
      expectedErrorCodes: ["duplicate_or_old_sequence"]
    }, duplicate.result.outcome?.errorCode === "duplicate_or_old_sequence" && gap9.result.outcome?.status === "buffered" && gap7.result.ackSeq === 9));

    let oversizedError = "";
    try { await invoke("tp06b_input", { sessionId: session.sessionId, payload: "x".repeat(1100) }); }
    catch (error) { oversizedError = String(error); }
    const invalid = frame(1, 10, 0, 0, []);
    invalid.protocol = "invalid-protocol";
    const invalidResult = await invoke("tp06b_input", { sessionId: session.sessionId, payload: JSON.stringify(invalid) });
    scenarios.push(scenario("oversize_invalid_protocol", {
      oversizedPayloadBytes: 1100,
      oversizedError,
      invalidProtocolOutcome: invalidResult.outcome,
      parserPath: "InputFrame::from_json before owner dispatch; receiver protocol rejection after parse"
    }, oversizedError.includes("payload_too_large") && invalidResult.outcome?.errorCode === "wrong_protocol"));

    const held = await sendFrame(1, 10, 0.75, 0.0);
    await waitForAck(activeChannelName, 1, 10, "held_ack_10");
    const diagnosticsBeforeExpiry = await invoke("tp06b_diagnostics", { sessionId: session.sessionId });
    await sleep(180);
    const diagnosticsAfterExpiry = await invoke("tp06b_diagnostics", { sessionId: session.sessionId });
    const expiredDelta = diagnosticsAfterExpiry.expiredHeldSamples - diagnosticsBeforeExpiry.expiredHeldSamples;
    scenarios.push(scenario("held_expiry", {
      heldInput: held,
      heldExpiryNs: 100000000,
      diagnosticsBeforeExpiry,
      diagnosticsAfterExpiry,
      expiredHeldSamplesDelta: expiredDelta,
      boundedRuntimeWaitMs: 180
    }, expiredDelta > 0));

    const pauseResult = await invoke("tp06b_pause", { sessionId: session.sessionId });
    const pausedEdge = await sendFrame(1, 11, 0.5, 0, [[1101, "jump"]]);
    const resumeResult = await invoke("tp06b_resume", { sessionId: session.sessionId });
    const resumed = await sendFrame(1, 100, 0, 0);
    await waitForAck(activeChannelName, 1, 100, "resume_baseline_ack_100");
    const pauseDiagnostics = await invoke("tp06b_diagnostics", { sessionId: session.sessionId });
    const pauseEdgeConsumed = (pauseDiagnostics.consumedEdgeIds || []).includes(1101);
    scenarios.push(scenario("pause_edge_discard_and_resume_baseline", {
      pauseResult,
      pausedEdge,
      resumeResult,
      resumed,
      pauseEdgeConsumed,
      staleEdgeDiscarded: !pauseEdgeConsumed,
      resumeSeqBaselineAck: resumed.result.ackSeq === 100,
      explicitCommandLifecycle: true
    }, pausedEdge.result.outcome?.errorCode === "paused" && !pauseEdgeConsumed && resumed.result.ackSeq === 100));

    const hiddenResult = await invoke("tp06b_hidden", { sessionId: session.sessionId });
    const hiddenEdge = await sendFrame(1, 101, 0.5, 0, [[1102, "dash"]]);
    const visibleResult = await invoke("tp06b_resume", { sessionId: session.sessionId });
    const visibleFrame = await sendFrame(1, 200, 0, 0);
    await waitForAck(activeChannelName, 1, 200, "hidden_resume_baseline_ack_200");
    const hiddenDiagnostics = await invoke("tp06b_diagnostics", { sessionId: session.sessionId });
    const hiddenEdgeConsumed = (hiddenDiagnostics.consumedEdgeIds || []).includes(1102);
    scenarios.push(scenario("hidden_edge_discard_and_resume_baseline", {
      hiddenResult,
      hiddenEdge,
      visibleResult,
      visibleFrame,
      hiddenEdgeConsumed,
      staleEdgeDiscarded: !hiddenEdgeConsumed,
      resumeSeqBaselineAck: visibleFrame.result.ackSeq === 200,
      explicitCommandLifecycle: true
    }, hiddenEdge.result.outcome?.errorCode === "paused" && !hiddenEdgeConsumed && visibleFrame.result.ackSeq === 200));

    oldSessionId = session.sessionId;
    oldChannelName = activeChannelName;
    const oldCallbackCountBeforeReplace = callbackRecords.length;
    const channelB = makeChannel("channel-b-epoch-2");
    newChannelName = "channel-b-epoch-2";
    const replacement = await invoke("tp06b_replace", {
      sessionId: oldSessionId,
      channel: channelB,
      worldEpoch: 2
    });
    session = replacement;
    activeChannelName = newChannelName;
    const epochInput = await sendFrame(2, 1, 0.2, 0, [[2001, "interact"]]);
    await waitForAck(activeChannelName, 2, 1, "replacement_epoch_ack_1");
    const oldCallbackCountAfterReplace = callbackRecords.filter(record => record.channel === oldChannelName).length;
    const newCallbacks = recordsFor(newChannelName);
    const newDiagnostics = await invoke("tp06b_diagnostics", { sessionId: session.sessionId });
    scenarios.push(scenario("epoch_replacement_barrier", {
      oldSessionId,
      newSessionId: session.sessionId,
      oldEpoch: 1,
      newEpoch: 2,
      oldGeneration: replacement.generation - 1,
      newGeneration: replacement.generation,
      oldChannelName,
      newChannelName,
      oldCallbackCountBeforeReplace,
      oldCallbackCountAfterReplace,
      oldCallbackAfterReplacement: "not_observable_channel_destruction_is_not_publicly_signaled",
      newChannelCallbacks: newCallbacks,
      newReceiverConsumedEdgeIds: newDiagnostics.consumedEdgeIds,
      epochInput,
      newEpochAckReset: epochInput.result.ackSeq === 1,
      newEpochEdgeExactlyOnce: (newDiagnostics.consumedEdgeIds || []).filter(id => id === 2001).length === 1,
      edgeEvidence: "formal InputReceiver diagnostics; WorldView DTO has no edgeEvents field"
    }, replacement.worldEpoch === 2 && replacement.generation > 1 && epochInput.result.ackSeq === 1 && (newDiagnostics.consumedEdgeIds || []).filter(id => id === 2001).length === 1));

    const diagnosticsFinal = await invoke("tp06b_diagnostics", { sessionId: session.sessionId });
    const stopSummary = await invoke("tp06b_stop", { sessionId: session.sessionId });
    let staleAfterStop = "";
    try { await invoke("tp06b_input", { sessionId: session.sessionId, payload: JSON.stringify(frame(2, 2)) }); }
    catch (error) { staleAfterStop = String(error); }
    let secondStop = "";
    try { await invoke("tp06b_stop", { sessionId: session.sessionId }); }
    catch (error) { secondStop = String(error); }
    scenarios.push(scenario("stop_and_stable_rejection", {
      diagnosticsFinal,
      stopSummary,
      staleAfterStop,
      secondStop,
      stopClean: stopSummary.stoppedCleanly === true,
      inputRejectedAfterStop: staleAfterStop.includes("stale_session"),
      stopRejectedAfterStop: secondStop.includes("stale_session")
    }, stopSummary.stoppedCleanly === true && staleAfterStop.includes("stale_session") && secondStop.includes("stale_session")));

    const nativeBlurObserved = nativeEvents.some(event => event.type === "blur");
    const nativeHiddenObserved = nativeEvents.some(event => event.type === "visibilitychange" && event.detail === "native_document_event" && event.visibilityState === "hidden");
    const allPass = scenarios.every(item => item.pass);
    const report = {
      schema: "continuous_tauri_input_runtime_tp06b1_v1",
      status: allPass ? "blocked_isolated_transport_candidate" : "blocked_probe_failure",
      machinePass: allPass,
      scope: "new Tauri 2.11.5 Windows WebView harness; formal parser/receiver/scheduler owner and typed Channel only; no Campaign or formal UI",
      generatedAtUtc: new Date().toISOString(),
      environment: {
        tauri: "2.11.5",
        platform: environment.platform,
        arch: environment.arch,
        os: environment.os,
        webviewUserAgent: navigator.userAgent,
        windowsWebViewVersion: environment.webviewVersion || null,
        processStartPerfMs: startedPerfMs
      },
      api: {
        fixedInputCommand: "tp06b_input(sessionId,payload:String)",
        commands: ["start", "input", "pause", "hidden", "resume", "replace", "stop", "diagnostics", "record_result", "finish"],
        formalParser: "continuous_input::InputFrame::from_json",
        parserBypass: false
      },
      owner: {
        oneInputReceiverPerSession: true,
        oneFixedStepSchedulerPerSession: true,
        oneWorldViewChannelPerGeneration: true,
        monotonicReceiptClock: "Rust Instant-based receipt_ns; JS performance.now recorded independently",
        typedChannel: "Channel<world_v3::WorldView>",
        worldAuthority: "synthetic read-only WorldStateV3 fixture; no Campaign/gameplay authority",
        locks: "registry lock only clones command sender or swaps owner; channel send, stop, drop and join occur outside registry lock",
        replacementBarrier: "old owner stop/join completes before new epoch owner is inserted",
        bounded: { inputMaxBytes: 1024, maxEdgesPerFrame: 8, maxPendingFrames: 32, maxQueuedEdges: 256, schedulerMaxTicksPerFrame: 5 }
      },
      session: { initial: initialSession, replaced: session, oldSessionId, oldChannelName, newChannelName },
      scenarios,
      callbacks: callbackRecords,
      channels: Object.fromEntries([...channelRecords.entries()].map(([name, records]) => [name, { callbackCount: records.length, records }])),
      commands,
      nativeLifecycle: {
        explicitPauseObserved: true,
        explicitHiddenObserved: true,
        nativeBlur: nativeBlurObserved ? "observed" : "not_measured",
        nativeVisibilityHidden: nativeHiddenObserved ? "observed" : "not_measured",
        syntheticDispatchUsed: false,
        events: nativeEvents,
        note: "Explicit Rust pause/hidden commands are not counted as native OS blur/visibility evidence."
      },
      stop: {
        finalDiagnostics: diagnosticsFinal,
        stopSummary,
        staleInputAfterStop: staleAfterStop,
        secondStopAfterStop: secondStop,
        processExitObservedByHarness: false,
        processExitObservation: "reported_after cargo run exit code by validation runner"
      },
      formalGaps: [
        "no CampaignStore or formal UI handoff",
        "native blur/visibility not_measured unless OS generated it",
        "formal 30Hz load not claimed; owner runs 60Hz scheduler",
        "Tauri public Channel queue depth and memory are not exposed",
        "process exit is externally verified by cargo run exit code",
        "no formal Gate D or Architecture approval"
      ],
      errors,
      commandExitCodes: { cargoTest: null, cargoRun: null },
      formalGate: { tp06: "blocked_isolated_transport_only", gateD: "blocked/no_go", architecture: "blocked/no_go" }
    };
    await invoke("tp06b_record_result", { report });
    show(`PASS: real WebView → tp06b_input string → formal parser/receiver/scheduler → Channel<WorldView> → JS\nscenarios=${scenarios.length}, allPass=${allPass}\nnative blur=${nativeBlurObserved ? "observed" : "not_measured"}, native visibility=${nativeHiddenObserved ? "observed" : "not_measured"}\nStopping owner and exiting…`, allPass ? "ok" : "error");
    await sleep(80);
    await invoke("tp06b_finish");
  }

  main().catch(async error => {
    const diagnostic = String(error && error.stack ? error.stack : error);
    errors.push(diagnostic);
    show(`FAIL: ${diagnostic}`, "error");
    try {
      await invoke("tp06b_record_result", {
        report: {
          schema: "continuous_tauri_input_runtime_tp06b1_v1",
          status: "blocked_probe_failure",
          machinePass: false,
          diagnostic,
          nativeLifecycle: { nativeBlur: "not_measured", nativeVisibilityHidden: "not_measured", syntheticDispatchUsed: false },
          commandExitCodes: { cargoTest: null, cargoRun: null },
          formalGate: { tp06: "blocked", gateD: "blocked/no_go", architecture: "blocked/no_go" }
        }
      });
      await sleep(50);
      await invoke("tp06b_finish");
    } catch (_) {
      // Keep the visible diagnostic if the failure occurred before Tauri IPC.
    }
  });
})();
</script>
</body>
</html>
