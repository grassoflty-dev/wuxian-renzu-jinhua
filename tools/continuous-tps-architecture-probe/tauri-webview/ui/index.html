<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AG-26 Tauri WebView stream and backpressure</title>
  <style>
    body { background: #111827; color: #e5e7eb; font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 28px; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    #status { border: 1px solid #374151; border-radius: 8px; padding: 14px; white-space: pre-wrap; }
    .ok { color: #86efac; } .error { color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>AG-26 WebView ↔ Rust continuous stream</h1>
    <div id="status">Starting real Tauri WebView stream probe…</div>
  </main>
  <script>
    const statusNode = document.getElementById("status");
    const protocol = "continuous-ipc";
    const version = 1;
    const epoch = 7;
    const frameCount = 45;
    const intervalMs = 33;
    const focusEvents = [];
    const focusListenerStartPerfMs = performance.now();
    window.addEventListener("blur", () => focusEvents.push({ type: "blur", source: "window", perfMs: performance.now(), visibilityState: document.visibilityState }));
    window.addEventListener("focus", () => focusEvents.push({ type: "focus", source: "window", perfMs: performance.now(), visibilityState: document.visibilityState }));
    document.addEventListener("visibilitychange", () => focusEvents.push({ type: "visibilitychange", source: "document", perfMs: performance.now(), visibilityState: document.visibilityState }));

    function show(text, className = "") {
      statusNode.className = className;
      statusNode.textContent = text;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function busyWait(ms) {
      const deadline = performance.now() + ms;
      while (performance.now() < deadline) {}
    }

    function finitePoint(point) {
      return point && [point.x, point.y, point.z].every(Number.isFinite);
    }

    function makeFrame(seq, edgeId = null) {
      return {
        protocol,
        version,
        worldEpoch: epoch,
        seq,
        clientTimeMs: seq * intervalMs,
        heldAxes: { x: 0.6, z: -0.8 },
        buttons: { jump: false, dash: Boolean(edgeId), interact: false },
        edgeEvents: edgeId === null ? [] : [{ id: edgeId, kind: "dash" }]
      };
    }

    function percentile(values, percentileValue) {
      if (!values.length) return null;
      const sorted = [...values].sort((a, b) => a - b);
      const index = (sorted.length - 1) * percentileValue;
      const lower = Math.floor(index);
      const upper = Math.ceil(index);
      if (lower === upper) return sorted[lower];
      return sorted[lower] + (sorted[upper] - sorted[lower]) * (index - lower);
    }

    function stats(values) {
      const finite = values.filter(Number.isFinite);
      return {
        count: finite.length,
        p50: percentile(finite, 0.50),
        p95: percentile(finite, 0.95),
        p99: percentile(finite, 0.99),
        max: finite.length ? Math.max(...finite) : null
      };
    }

    function intervalStats(records, field) {
      const intervals = [];
      for (let index = 1; index < records.length; index += 1) {
        intervals.push(records[index][field] - records[index - 1][field]);
      }
      return { intervalsMs: intervals, distribution: stats(intervals) };
    }

    function sequenceStats(values) {
      const duplicates = values.filter((value, index) => values.indexOf(value) !== index)
        .filter((value, index, array) => array.indexOf(value) === index);
      const missing = [];
      if (values.length) {
        for (let value = Math.min(...values); value <= Math.max(...values); value += 1) {
          if (!values.includes(value)) missing.push(value);
        }
      }
      return {
        first: values[0] ?? null,
        last: values[values.length - 1] ?? null,
        count: values.length,
        duplicates,
        missing,
        strictlyIncreasing: values.every((value, index) => index === 0 || value > values[index - 1])
      };
    }

    function validateWorldView(snapshot, expectedAck, expectedEdgeId) {
      const edgeAck = snapshot.edgeEvents?.find((item) => item.id === expectedEdgeId && item.kind === "dash");
      const valid = snapshot.protocol === protocol &&
        snapshot.version === version &&
        snapshot.worldEpoch === epoch &&
        Number.isInteger(snapshot.serverTick) &&
        snapshot.ackSeq === expectedAck &&
        finitePoint(snapshot.player?.transform?.positionM) &&
        finitePoint(snapshot.player?.transform?.velocityMps) &&
        [snapshot.player?.meters?.hp, snapshot.player?.meters?.stamina, snapshot.player?.meters?.ammo].every(Number.isFinite);
      return { valid, edgeAck: edgeAck || null };
    }

    async function registerFocusMeasurement(core) {
      let tauriFocusEvents = [];
      let unlisten = null;
      try {
        const currentWindow = window.__TAURI__?.window?.getCurrentWindow?.();
        if (currentWindow?.onFocusChanged) {
          unlisten = await currentWindow.onFocusChanged((event) => {
            tauriFocusEvents.push({ focused: event.payload, perfMs: performance.now() });
          });
        }
      } catch (error) {
        tauriFocusEvents.push({ registrationError: String(error) });
      }
      return { tauriFocusEvents, unlisten };
    }

    async function runPauseResumeProbe(core) {
      await core.invoke("reset_lifecycle_probe");
      const activeStart = performance.now();
      const active = await core.invoke("submit_pause_probe_input", { frame: makeFrame(1, 27001) });
      const pauseStart = performance.now();
      const pausedBarrier = await core.invoke("set_pause_barrier", { paused: true });
      const pausedInput = await core.invoke("submit_pause_probe_input", { frame: makeFrame(2, 27002) });
      const resumeStart = performance.now();
      const resumedBarrier = await core.invoke("set_pause_barrier", { paused: false });
      const resumedInput = await core.invoke("submit_pause_probe_input", { frame: makeFrame(3, 27003) });
      const resumeEnd = performance.now();
      const valid = active.consumed && active.edgeConsumed &&
        pausedBarrier.paused && pausedInput.paused && !pausedInput.consumed && !pausedInput.edgeConsumed && pausedInput.ackSeq === null &&
        !resumedBarrier.paused && resumedBarrier.staleInputCleared && resumedBarrier.ackWatermark === null &&
        resumedInput.consumed && resumedInput.ackSeq === 3 && resumedInput.edgeConsumed &&
        resumedInput.serverTick > active.serverTick;
      if (!valid) throw new Error("pause/resume barrier semantics failed");
      return {
        mode: "explicit_rust_pause_barrier",
        valid,
        active,
        pausedBarrier,
        pausedInput,
        resumedBarrier,
        resumedInput,
        jsMonotonic: {
          activeStartPerfMs: activeStart,
          pauseStartPerfMs: pauseStart,
          resumeStartPerfMs: resumeStart,
          resumeEndPerfMs: resumeEnd
        },
        staleHeldAndEdgeNotConsumed: !pausedInput.consumed && !pausedInput.edgeConsumed,
        newAckBaselineAfterResume: resumedInput.ackSeq === 3
      };
    }

    async function runEpochProbe(core) {
      const frames = [
        makeFrame(1, 28001),
        { ...makeFrame(1, 28002), worldEpoch: 8 },
        { ...makeFrame(2, 28003), worldEpoch: 7 },
        { ...makeFrame(2), worldEpoch: 8 }
      ];
      const records = [];
      let resolveReceived;
      const receivedDone = new Promise((resolve) => { resolveReceived = resolve; });
      const channel = new core.Channel();
      let renderEpoch = 7;
      const renderedSnapshots = [];
      const rejectedRenderSnapshots = [];
      channel.onmessage = (snapshot) => {
        if (snapshot.worldEpoch < renderEpoch) {
          rejectedRenderSnapshots.push({ worldEpoch: snapshot.worldEpoch, ackSeq: snapshot.ackSeq });
          return;
        }
        if (snapshot.worldEpoch > renderEpoch) renderEpoch = snapshot.worldEpoch;
        renderedSnapshots.push({ worldEpoch: snapshot.worldEpoch, serverTick: snapshot.serverTick, ackSeq: snapshot.ackSeq, edgeIds: (snapshot.edgeEvents || []).map((event) => event.id) });
        records.push(snapshot);
        if (records.length === 3) resolveReceived();
      };
      const invokeStart = performance.now();
      const summaryPromise = core.invoke("epoch_isolation_probe", { frames, onWorldView: channel });
      const rustSummary = await summaryPromise;
      await Promise.race([receivedDone, new Promise((_, reject) => setTimeout(() => reject(new Error("epoch Channel timeout")), 3000))]);
      const epoch7 = renderedSnapshots.filter((snapshot) => snapshot.worldEpoch === 7);
      const epoch8 = renderedSnapshots.filter((snapshot) => snapshot.worldEpoch === 8);
      const oldRejected = rustSummary.rejected.some((item) => item.worldEpoch === 7 && item.seq === 2 && item.reason === "stale_epoch_rejected");
      const ackReset = JSON.stringify(rustSummary.ackByEpoch) === JSON.stringify([[7, [1]], [8, [1, 2]]]);
      const edgeReset = JSON.stringify(rustSummary.edgeWatermarkByEpoch) === JSON.stringify([[7, [28001]], [8, [28002]]]);
      const noOldRenderedAfterEpoch8 = renderedSnapshots.slice(renderedSnapshots.findIndex((snapshot) => snapshot.worldEpoch === 8)).every((snapshot) => snapshot.worldEpoch === 8);
      const valid = rustSummary.finalEpoch === 8 && oldRejected && ackReset && edgeReset &&
        epoch7.length === 1 && epoch8.length === 2 && rejectedRenderSnapshots.length === 0 && noOldRenderedAfterEpoch8;
      if (!valid) throw new Error("epoch isolation validation failed");
      return {
        valid,
        invokeStartPerfMs: invokeStart,
        inputFrames: frames,
        rustSummary,
        renderedSnapshots,
        rejectedRenderSnapshots,
        oldEpochInputRejected: oldRejected,
        ackResetByEpoch: ackReset,
        edgeWatermarkResetByEpoch: edgeReset,
        noOldSnapshotRenderedAfterEpoch8: noOldRenderedAfterEpoch8
      };
    }

    async function runChildFocusAndChannelProbe(core, focusRegistration) {
      await core.invoke("reset_lifecycle_probe");
      const channelARecords = [];
      let resolveA;
      const channelADone = new Promise((resolve) => { resolveA = resolve; });
      const channelA = new core.Channel();
      channelA.onmessage = (snapshot) => {
        channelARecords.push({ worldId: snapshot.worldId, worldEpoch: snapshot.worldEpoch, ackSeq: snapshot.ackSeq, edgeIds: (snapshot.edgeEvents || []).map((event) => event.id) });
        resolveA();
      };
      await core.invoke("input_roundtrip", { frame: makeFrame(1, 41001), onWorldView: channelA });
      await Promise.race([channelADone, new Promise((_, reject) => setTimeout(() => reject(new Error("Channel A timeout")), 3000))]);
      const focusCountBeforeChild = focusEvents.length;
      const childOpenStartPerfMs = performance.now();
      core.invoke("open_focus_child").catch(() => {});
      await sleep(800);
      let childResult = null;
      try { childResult = await core.invoke("get_child_channel_result"); } catch (_) {}
      const childOpenEndPerfMs = performance.now();
      const childFocusEvents = focusEvents.slice(focusCountBeforeChild);
      const tauriChildFocusEvents = focusRegistration.tauriFocusEvents.slice();
      const childReopenObserved = Boolean(childResult?.newChannelNormal);
      core.invoke("request_child_release").catch(() => {});
      await sleep(250);
      if (focusRegistration.unlisten) await focusRegistration.unlisten();
      const focusObserved = childFocusEvents.some((event) => event.type === "blur") ||
        tauriChildFocusEvents.some((event) => event.focused === false);
      return {
        focusObserved,
        focusStatus: focusObserved ? "observed" : "not_measured",
        visibilityHiddenObserved: childFocusEvents.some((event) => event.visibilityState === "hidden"),
        syntheticDispatchUsed: false,
        actualEventSource: focusObserved ? "native window/document event" : "none",
        initialVisibilityState: document.visibilityState,
        focusListenerStartPerfMs,
        childOpenStartPerfMs,
        childOpenEndPerfMs,
        windowDocumentEvents: childFocusEvents,
        tauriFocusEvents: tauriChildFocusEvents,
        channelA: {
          marker: 41001,
          callbacksBeforeDestroy: channelARecords,
          callbackCount: channelARecords.length,
          oldChannelCallbackAfterDestroy: "not_measured; old window/channel destruction is not observable from surviving JS"
        },
        childReopenObserved,
        childResult: childResult || {
          status: "not_measured",
          reason: "child WebView did not publish its Channel B result before timeout"
        },
        channelCloseSentinelObserved: false,
        note: focusObserved ? "real focus transition observed" : "No native blur was observed; no synthetic event was counted"
      };
    }

    async function runPassiveFocusMeasurement(focusRegistration) {
      await sleep(100);
      if (focusRegistration.unlisten) await focusRegistration.unlisten();
      const blurObserved = focusEvents.some((event) => event.type === "blur") || focusRegistration.tauriFocusEvents.some((event) => event.focused === false);
      return {
        focusObserved: blurObserved,
        focusStatus: blurObserved ? "observed" : "not_measured",
        visibilityHiddenObserved: focusEvents.some((event) => event.visibilityState === "hidden"),
        syntheticDispatchUsed: false,
        actualEventSource: blurObserved ? "native window/document event" : "none",
        listenerRegistered: !focusRegistration.tauriFocusEvents.some((event) => event.registrationError),
        initialVisibilityState: document.visibilityState,
        focusListenerStartPerfMs,
        windowDocumentEvents: focusEvents,
        tauriFocusEvents: focusRegistration.tauriFocusEvents,
        note: blurObserved ? "real blur observed" : "No OS focus transition was injected; no synthetic blur was counted"
      };
    }

    async function runSingleFrame(core) {
      const inputFrame = makeFrame(42, 99005);
      const inputPayload = JSON.stringify(inputFrame);
      let resolveReceived;
      const receivedPromise = new Promise((resolve) => { resolveReceived = resolve; });
      const channel = new core.Channel();
      channel.onmessage = (snapshot) => resolveReceived({ snapshot, receivedAt: performance.now() });
      const invokeStart = performance.now();
      const invokePromise = core.invoke("input_roundtrip", { frame: inputFrame, onWorldView: channel });
      const { snapshot, receivedAt } = await Promise.race([
        receivedPromise,
        new Promise((_, reject) => setTimeout(() => reject(new Error("single-frame Channel timeout")), 3000))
      ]);
      await invokePromise;
      const validation = validateWorldView(snapshot, inputFrame.seq, 99005);
      if (!validation.valid || !validation.edgeAck) throw new Error("AG-25 single-frame WorldView validation failed");
      let invalidFrameRejected = false;
      let invalidError = "";
      try {
        await core.invoke("input_roundtrip", {
          frame: { ...inputFrame, protocol: "invalid-protocol" },
          onWorldView: channel
        });
      } catch (error) {
        invalidFrameRejected = true;
        invalidError = String(error);
      }
      if (!invalidFrameRejected) throw new Error("AG-25 invalid protocol was accepted");
      return {
        webviewRoundtrip: true,
        inputFrame,
        inputPayloadBytesUtf8: new TextEncoder().encode(inputPayload).length,
        outputPayload: snapshot,
        outputPayloadBytesUtf8: new TextEncoder().encode(JSON.stringify(snapshot)).length,
        edgeAck: validation.edgeAck,
        invalidFrameRejected,
        invalidError,
        channelLatencyMs: receivedAt - invokeStart
      };
    }

    async function runInputDiagnostics(core) {
      const frames = [makeFrame(1), makeFrame(1), makeFrame(3), makeFrame(2), makeFrame(5, 99007)];
      const invokeStart = performance.now();
      const rustReport = await core.invoke("inspect_input_sequence", { frames });
      const invokeEnd = performance.now();
      const payloads = frames.map((frame) => JSON.stringify(frame));
      const expected = { duplicateSeqs: [1], outOfOrderSeqs: [2], missingSeqs: [4] };
      const matches = JSON.stringify(rustReport.duplicateSeqs) === JSON.stringify(expected.duplicateSeqs) &&
        JSON.stringify(rustReport.outOfOrderSeqs) === JSON.stringify(expected.outOfOrderSeqs) &&
        JSON.stringify(rustReport.missingSeqs) === JSON.stringify(expected.missingSeqs) &&
        rustReport.structurallyValid === true;
      if (!matches) throw new Error("input duplicate/out-of-order/gap classification mismatch");
      return {
        scenario: "duplicate_out_of_order_gap",
        invokeLatencyMs: invokeEnd - invokeStart,
        inputFrames: frames,
        inputPayloadBytesUtf8: payloads.map((payload) => new TextEncoder().encode(payload).length),
        rustReport,
        expectedClassification: expected,
        classificationMatched: matches
      };
    }

    async function runStreamScenario(core, scenario, callbackDelayMs) {
      const edgeId = scenario === "normal_30hz" ? 99010 : 99011;
      const inputFrames = Array.from({ length: frameCount }, (_, index) =>
        makeFrame(index + 1, index + 1 === 10 ? edgeId : null));
      const receivedRecords = [];
      let resolveReceived;
      const receivedDone = new Promise((resolve) => { resolveReceived = resolve; });
      const channel = new core.Channel();
      channel.onmessage = (snapshot) => {
        const callbackStart = performance.now();
        const payloadBytesUtf8 = new TextEncoder().encode(JSON.stringify(snapshot)).length;
        const edgeIds = (snapshot.edgeEvents || []).map((item) => item.id);
        if (callbackDelayMs > 0) busyWait(callbackDelayMs);
        const callbackEnd = performance.now();
        receivedRecords.push({
          receiveIndex: receivedRecords.length,
          callbackStartPerfMs: callbackStart,
          callbackEndPerfMs: callbackEnd,
          callbackDurationMs: callbackEnd - callbackStart,
          worldEpoch: snapshot.worldEpoch,
          serverTick: snapshot.serverTick,
          ackSeq: snapshot.ackSeq,
          payloadBytesUtf8,
          edgeIds
        });
        if (receivedRecords.length === frameCount) resolveReceived();
      };
      const invokeStart = performance.now();
      const streamPromise = core.invoke("stream_world_views", {
        plan: { scenario, intervalMs, frames: inputFrames },
        onWorldView: channel
      });
      const rustSummary = await streamPromise;
      const invokeReturnedAt = performance.now();
      await Promise.race([
        receivedDone,
        new Promise((_, reject) => setTimeout(() => reject(new Error(`${scenario} Channel did not deliver ${frameCount} frames`)), 12000))
      ]);
      const streamEnd = performance.now();
      const sendRecords = rustSummary.sendRecords;
      const receiveSeqs = receivedRecords.map((record) => record.ackSeq);
      const sendSeqs = sendRecords.map((record) => record.seq);
      const sendTicks = sendRecords.map((record) => record.serverTick);
      const receiveTicks = receivedRecords.map((record) => record.serverTick);
      const sendIntervals = intervalStats(sendRecords, "sentElapsedMs");
      const receiveIntervals = intervalStats(receivedRecords, "callbackStartPerfMs");
      const ackStats = sequenceStats(receiveSeqs);
      const edgeAckCount = receivedRecords.reduce((count, record) => count + (record.edgeIds.includes(edgeId) ? 1 : 0), 0);
      const allSnapshotsValid = receivedRecords.every((record) => record.worldEpoch === epoch && Number.isInteger(record.serverTick));
      const orderedTicks = receiveTicks.every((tick, index) => index === 0 || tick > receiveTicks[index - 1]);
      const rustSendSpanMs = sendRecords.at(-1).sentElapsedMs - sendRecords[0].sentElapsedMs;
      const jsReceiveSpanMs = receivedRecords.at(-1).callbackStartPerfMs - receivedRecords[0].callbackStartPerfMs;
      const totalWallClockMs = streamEnd - invokeStart;
      const rustCompletedBeforeLastCallback = rustSummary.completedElapsedMs < jsReceiveSpanMs;
      const classification = {
        sendCount: sendRecords.length,
        receiveCount: receivedRecords.length,
        sendSeqs,
        receiveSeqs,
        sendTicks,
        receiveTicks,
        sendMonotonic: sendRecords.every((record, index) => index === 0 || record.sentElapsedMs >= sendRecords[index - 1].sentElapsedMs),
        receiveMonotonic: receivedRecords.every((record, index) => index === 0 || record.callbackStartPerfMs >= receivedRecords[index - 1].callbackStartPerfMs),
        orderedTicks,
        allSnapshotsValid,
        ack: ackStats,
        edgeAckCount,
        edgeAckExactlyOnce: edgeAckCount === 1,
        droppedOrMergedObserved: receivedRecords.length !== frameCount || !ackStats.strictlyIncreasing,
        rustCompletedBeforeLastCallback
      };
      if (sendRecords.length !== frameCount || receivedRecords.length !== frameCount ||
          !classification.sendMonotonic || !classification.receiveMonotonic || !orderedTicks ||
          !allSnapshotsValid || !ackStats.strictlyIncreasing || !classification.edgeAckExactlyOnce) {
        throw new Error(`${scenario} stream validation failed: ${JSON.stringify(classification)}`);
      }
      return {
        scenario,
        callbackDelayMs,
        intervalTargetMs: intervalMs,
        frameCount,
        inputFrames,
        inputPayloadBytesUtf8: inputFrames.map((frame) => new TextEncoder().encode(JSON.stringify(frame)).length),
        rustSummary,
        jsReceiveRecords: receivedRecords,
        classification,
        timing: {
          invokeStartPerfMs: invokeStart,
          invokeReturnedPerfMs: invokeReturnedAt,
          rustCompletedElapsedMs: rustSummary.completedElapsedMs,
          streamEndPerfMs: streamEnd,
          rustSendSpanMs,
          jsReceiveSpanMs,
          totalWallClockMs,
          actualRustSendThroughputHz: rustSendSpanMs > 0 ? frameCount / (rustSendSpanMs / 1000) : null,
          actualJsReceiveThroughputHz: jsReceiveSpanMs > 0 ? frameCount / (jsReceiveSpanMs / 1000) : null,
          invokeToLastCallbackMs: receivedRecords.at(-1).callbackStartPerfMs - invokeStart
        },
        intervals: {
          rustSend: sendIntervals,
          jsReceive: receiveIntervals,
          callbackDuration: stats(receivedRecords.map((record) => record.callbackDurationMs)),
          payloadBytes: stats(receivedRecords.map((record) => record.payloadBytesUtf8))
        },
        latencyTargets: {
          p95TargetMs: 50,
          hardLimitMs: 120,
          observedCallbackIntervalP50Ms: receiveIntervals.distribution.p50,
          observedCallbackIntervalP95Ms: receiveIntervals.distribution.p95,
          observedCallbackIntervalP99Ms: receiveIntervals.distribution.p99,
          observedCallbackIntervalMaxMs: receiveIntervals.distribution.max,
          underP95Target: receiveIntervals.distribution.p95 <= 50,
          underHardLimit: receiveIntervals.distribution.p95 <= 120
        },
        backpressure: {
          queueDepthObservable: false,
          queueDepthNote: "Tauri public JS Channel exposes ordered delivery but no queue-depth metric",
          memoryObservable: false,
          memoryNote: "No public Channel memory/queue metric was available",
          callbackDelayMs,
          rustCompletedBeforeLastCallback,
          allFramesDelivered: receivedRecords.length === frameCount,
          errorsObserved: [],
          dropsOrMergesObserved: false,
          recoveryObserved: receivedRecords.length === frameCount && classification.orderedTicks
        }
      };
    }

    async function runReopenedWindow(core) {
      const records = [];
      let resolveReceived;
      const receivedDone = new Promise((resolve) => { resolveReceived = resolve; });
      const channel = new core.Channel();
      channel.onmessage = (snapshot) => {
        records.push({ worldEpoch: snapshot.worldEpoch, serverTick: snapshot.serverTick, ackSeq: snapshot.ackSeq, edgeIds: (snapshot.edgeEvents || []).map((event) => event.id) });
        if (records.length === 1) resolveReceived();
      };
      await core.invoke("child_channel_probe", { onWorldView: channel });
      await Promise.race([receivedDone, new Promise((_, reject) => setTimeout(() => reject(new Error("reopened Channel timeout")), 3000))]);
      const valid = records.length === 1 && records[0].worldEpoch === 8 && records[0].ackSeq === 42001 && records[0].edgeIds?.includes(42001);
      if (!valid) throw new Error("reopened window Channel validation failed");
      const extra = {
        status: "observed",
        childWindowLabel: "ag28-child",
        oldWindowClosedBeforeNewWindowProbe: false,
        oldChannelCallbackAfterClose: "not_measured; parent window survived while child was focused",
        newChannelCallbacks: records,
        newChannelNormal: valid,
        closeSentinel: "not_exposed_by_public_js_channel"
      };
      await core.invoke("record_child_channel_result", { result: extra });
      while (!(await core.invoke("child_release_requested"))) await sleep(50);
      await core.invoke("close_child_window");
    }

    async function main() {
      const core = window.__TAURI__?.core;
      if (!core?.invoke || !core?.Channel) throw new Error("withGlobalTauri core.invoke/Channel is unavailable");
      const currentWindowLabel = await core.invoke("current_window_label");
      if (currentWindowLabel === "main") {
        const singleFrame = await runSingleFrame(core);
        const pauseResume = await runPauseResumeProbe(core);
        const epochIsolation = await runEpochProbe(core);
        await core.invoke("start_ag29_matrix", {
          regression: {
            singleFrame: { webviewRoundtrip: singleFrame.webviewRoundtrip, invalidFrameRejected: singleFrame.invalidFrameRejected },
            pauseResume: { valid: pauseResume.valid, staleHeldAndEdgeNotConsumed: pauseResume.staleHeldAndEdgeNotConsumed },
            epochIsolation: { valid: epochIsolation.valid, oldEpochInputRejected: epochIsolation.oldEpochInputRejected, ackResetByEpoch: epochIsolation.ackResetByEpoch }
          }
        });
        return;
      }
      if (currentWindowLabel === "ag28-child") {
        await runReopenedWindow(core);
        return;
      }
      const singleFrame = await runSingleFrame(core);
      const inputDiagnostics = await runInputDiagnostics(core);
      const normal = await runStreamScenario(core, "normal_30hz", 0);
      const slow = await runStreamScenario(core, "slow_consumer_90ms", 90);
      const focusRegistration = await registerFocusMeasurement(core);
      const pauseResume = await runPauseResumeProbe(core);
      const epochIsolation = await runEpochProbe(core);
      const focus = await runPassiveFocusMeasurement(focusRegistration);
      const webviewRoundtrip = singleFrame.webviewRoundtrip &&
        inputDiagnostics.classificationMatched &&
        normal.classification.sendCount === frameCount &&
        slow.classification.receiveCount === frameCount &&
        pauseResume.valid && epochIsolation.valid;
      const report = {
        status: "lifecycle_epoch_probe_observed",
        webviewRoundtrip,
        webview_roundtrip: webviewRoundtrip,
        tauriVersion: "2.11.5",
        platform: "windows",
        singleFrame,
        inputDiagnostics,
        streams: { normal, slow },
        focus,
        pauseResume,
        epochIsolation,
        focusObserved: focus.focusObserved,
        visibilityHiddenObserved: focus.visibilityHiddenObserved,
        childReopenObserved: false,
        oldChannelCallbackAfterDestroy: "not_measured; child WebView focus/reopen suspended parent JS in this environment",
        channelCloseSentinelObserved: false,
        lifecycle: {
          close: {
            channelTerminationObserved: false,
            channelTerminationEvidence: "Tauri 2.11.5 cleanup unregisters the JS callback when Rust Channel drops; the public JS Channel API has no onmessage close event",
            windowCloseRequested: true,
            processExitObserved: false
          },
          blurPause: focus.focusStatus,
          epochReset: "observed_in_command_epoch_probe",
          reopenedWindow: {
            status: "not_measured",
            reason: "real child creation/focus was attempted during AG-28 development but suspended parent JS before reliable A/B Channel evidence; final run did not count it",
            newChannelNormal: "not_measured",
            oldChannelCallbackAfterDestroy: "not_measured",
            closeSentinel: "not_exposed_by_public_js_channel"
          }
        },
        measurementLimits: [
          "Tauri public JS Channel exposes no queue-depth or memory metric.",
          "The slow-consumer test uses a bounded 90ms synchronous callback delay; it observes ordered queued delivery, not a platform queue-size guarantee.",
          "The focus result is not_measured unless a native blur event occurs; no synthetic event is counted.",
          "No claim is made about production WorldView cost or formal TP-06 integration."
        ]
      };
      if (!webviewRoundtrip) throw new Error("AG-26 acceptance checks did not pass");
      await core.invoke("record_result", { report });
      show("PASS: continuous JS → Rust → Channel → JS\n" +
        `normal=${normal.frameCount} frames @ ${normal.timing.actualRustSendThroughputHz.toFixed(2)}Hz\n` +
        `slow=${slow.frameCount} frames, callback delay=${slow.callbackDelayMs}ms, ordered=${slow.classification.orderedTicks}\n` +
        `pause=${pauseResume.valid}, epoch=${epochIsolation.valid}, focus=${focus.focusStatus}, child=not_measured`, "ok");
      await sleep(50);
      await core.invoke("finish_probe");
    }

    main().catch(async (error) => {
      const diagnostic = String(error && error.stack ? error.stack : error);
      show("FAIL: " + diagnostic, "error");
      try {
        await window.__TAURI__.core.invoke("record_result", {
          report: {
            status: "lifecycle_epoch_probe_failed",
            webviewRoundtrip: false,
            webview_roundtrip: false,
            tauriVersion: "2.11.5",
            platform: "windows",
            diagnostic,
            lifecycle: {
              close: {
                channelTerminationObserved: false,
                channelTerminationEvidence: "probe failed before Channel close observation",
                windowCloseRequested: false,
                processExitObserved: false
              }
            }
          }
        });
        await window.__TAURI__.core.invoke("finish_probe");
      } catch (_) {
        // Keep the diagnostic visible if IPC itself is unavailable.
      }
    });
  </script>
