<!DOCTYPE html>
<!-- zz3d.html — 郑吒「剪影视觉外壳+三视图皮肤」3D 角色预览(ZZ3D 独立通道)
 * 依赖 vendor/three.min.js + zz3d.js；纯白背景。
 * 暴露 window.__setModel(name) 供截图脚本重建模型；
 * 暴露 window.setModelView('front'|'side'|'back'|'face'|'profile') 切换视角；
 * 模型异步构建完成置 window.__modelReady=true。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郑吒 ZZ3D 角色预览</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    #host { position: fixed; left: 0; top: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; z-index: 1; background: #ffffff; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="vendor/three.min.js"></script>
  <script src="zz3d.js"></script>

  <script>
    var host = document.getElementById('host');
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight, true);
    host.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    var camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 300);

    var group = new THREE.Group();
    scene.add(group);

    // 脚下软阴影圆(视觉贴地；无真阴影)
    var sh = document.createElement('canvas'); sh.width = sh.height = 256;
    var sx = sh.getContext('2d');
    var gg = sx.createRadialGradient(128, 128, 8, 128, 128, 126);
    gg.addColorStop(0, 'rgba(0,0,0,0.20)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    sx.fillStyle = gg; sx.fillRect(0, 0, 256, 256);
    var shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.8),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sh), transparent: true, depthWrite: false, depthTest: false }));
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.01;
    shadow.renderOrder = 500;
    scene.add(shadow);

    // 视角表(人物高 2.3，中心 y≈1.15，头部 y≈2.0)
    var CAM = {
      front:   { pos: [0, 1.35, 5.2], look: [0, 1.15, 0] },
      side:    { pos: [-3.3, 1.5, 3.6], look: [0, 1.15, 0] },  // 前左 45° 斜视
      back:    { pos: [0, 1.35, -5.2], look: [0, 1.15, 0] },
      face:    { pos: [0, 2.0, 2.35], look: [0, 1.98, 0] },
      profile: { pos: [-5.2, 1.35, 0], look: [0, 1.15, 0] }    // 纯侧 90°(-X 侧=侧立绘同向)
    };

    function resize() {
      var w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, true);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.render(scene, camera);
    }
    window.addEventListener('resize', resize);

    window.setModelView = function (v) {
      var c = CAM[v] || CAM.front;
      camera.position.set(c.pos[0], c.pos[1], c.pos[2]);
      camera.lookAt(c.look[0], c.look[1], c.look[2]);
      camera.updateMatrixWorld(true);
      renderer.render(scene, camera);
      return 'ok:' + v;
    };

    // 任意方位角环绕相机：deg=0 正面(+Z)，顺时针(俯视)增大，90=角色左侧(-X)，180=背面
    window.setModelOrbit = function (deg, elev, dist) {
      var r = dist || 5.4, ey = elev != null ? elev : 1.5;
      var a = deg * Math.PI / 180;
      camera.position.set(-Math.sin(a) * r, ey, Math.cos(a) * r);
      camera.lookAt(0, 1.15, 0);
      camera.updateMatrixWorld(true);
      renderer.render(scene, camera);
      return 'ok:orbit' + deg;
    };

    window.__setModel = function (name) {
      if (!window.ZZ3DBuilder) return 'no ZZ3DBuilder';
      window.__modelReady = false;
      var res = window.ZZ3DBuilder.build(group, {
        url: 'assets/pc_zhengzha_front.png',
        sideUrl: 'assets/pc_zhengzha_side.png',
        backUrl: 'assets/pc_zhengzha_back.png'
      });
      renderer.render(scene, camera);
      return (res || '') + ':' + name;
    };

    // 构建完成后持续渲染一帧(材质贴图就绪)
    function tick() { if (window.__modelReady) renderer.render(scene, camera); requestAnimationFrame(tick); }
    requestAnimationFrame(tick);

    function init() {
      window.__setModel('zhenghai');
      window.setModelView('front');
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  </script>
</body>
</html>
